org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# THE VERSION, IN ONE PLACE.
#
# versioning.md: one whole number per app, and the number lives in the filename, in the tag and in
# what the app shows the person using it. §6 says the build produces the name and hands do not, so
# this property is read by build.gradle.kts (versionCode, versionName, and therefore the About line)
# and by .github/workflows/build.yml (the APK filename and the release tag). Bumping this one line
# moves all four together, and no other file carries a version number that could drift from it.
appVersion=1
